# 发布：推送 `v*` tag 时构建全部平台的产物并发布到 GitHub Releases。
#
# 手动运行（workflow_dispatch）是试跑：构建、检查、打包全部照做，只是不发布——改了这个
# workflow 或发布脚本之后先试跑一遍。
#
# 出哪些文件（20 个）：
# - 四种平台：linux-gnu（glibc ≥ 2.28）、linux-musl（全静态）、windows-msvc（C 运行时静态
#   链接）、macOS（≥ 11）；
# - x86_64 每种平台按 CPU 等级出四份（x86-64 psABI 的 v1–v4），aarch64 每种平台一份。
#   每一份的 Rust 代码与 C 依赖（SQLite、mimalloc、ring）都按那一级的指令集编译，参数在
#   .github/scripts/release-env.sh 里算。
#
# 每个产物发布前都要过：链接检查（check-binary.sh）、实际运行（smoke-test.sh）、用同样的
# 参数编译并跑库的全部单元测试。runner 的 CPU 跑不动的等级（常见的是 v4：不是每台 runner 都有
# AVX-512）没法运行，只做链接检查，发布说明里会列出来。
#
# 与 ci.yml 相同的约定：action 按 commit SHA 固定、默认只读权限、checkout 不保留凭据、
# cargo 一律 `--locked`、`run:` 里不直接展开 `${{ }}`。另外发布构建不用任何缓存：缓存能被
# 别的 workflow 运行写入，发布产物只从源码与 Cargo.lock 锁定的依赖构建。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个 tag 的发布不并行；也不取消跑到一半的（取消会留下半个 release）。
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    # Windows 上也用 bash（Git Bash）：各平台跑同一份脚本。
    shell: bash

jobs:
  verify:
    # 构建之前先确认这个提交可以发布：tag 与 Cargo.toml 的版本一致、在 main 上、CHANGELOG 有
    # 这一版的说明、fmt / clippy / 测试通过。任何一项不过，后面 20 个构建都不开始。
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 要判断 tag 的提交是不是 main 的祖先，需要完整历史。
          fetch-depth: 0
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # [package] 的 version 是文件里第一个顶格的 `version = "..."`。
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$version" || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            # 只从 main 上的提交发布。`^{commit}`：带说明的 tag 是一个独立对象，先解到它
            # 指向的提交。
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$(git rev-parse "$GITHUB_SHA^{commit}")" FETCH_HEAD; then
              echo "::error::the tagged commit is not on main"
              exit 1
            fi
            # 正式发布：CHANGELOG 必须已经有这个版本的段落。
            .github/scripts/release-notes.sh "$version" > notes.md
          else
            # 试跑：看一眼说明长什么样。版本段已经写好就用它，否则用 Unreleased 段。
            .github/scripts/release-notes.sh "$version" > notes.md ||
              .github/scripts/release-notes.sh "$version" Unreleased > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  build:
    name: ${{ matrix.triple }}${{ matrix.level && format(' v{0}', matrix.level) || '' }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-gnu 在 manylinux_2_28 容器（AlmaLinux 8，glibc 2.28）里编译：链接到的 glibc
          # 符号版本不会比 2.28 新，Debian 10+ / Ubuntu 20.04+ / RHEL 8+ 都能跑。镜像按摘要
          # 固定；Dependabot 不管这里，升级要手动改 tag 与摘要。
          - { triple: x86_64-unknown-linux-gnu, level: 1, os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36" }
          - { triple: x86_64-unknown-linux-gnu, level: 2, os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36" }
          - { triple: x86_64-unknown-linux-gnu, level: 3, os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36" }
          - { triple: x86_64-unknown-linux-gnu, level: 4, os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36" }
          - { triple: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64:2026.11.07-1@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21" }
          # linux-musl：全静态，不依赖目标机器上的任何库（Alpine、更老的 glibc 都能跑）。
          - { triple: x86_64-unknown-linux-musl, level: 1, os: ubuntu-latest }
          - { triple: x86_64-unknown-linux-musl, level: 2, os: ubuntu-latest }
          - { triple: x86_64-unknown-linux-musl, level: 3, os: ubuntu-latest }
          - { triple: x86_64-unknown-linux-musl, level: 4, os: ubuntu-latest }
          - { triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { triple: x86_64-pc-windows-msvc, level: 1, os: windows-latest }
          - { triple: x86_64-pc-windows-msvc, level: 2, os: windows-latest }
          - { triple: x86_64-pc-windows-msvc, level: 3, os: windows-latest }
          - { triple: x86_64-pc-windows-msvc, level: 4, os: windows-latest }
          - { triple: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { triple: x86_64-apple-darwin, level: 1, os: macos-15-intel }
          - { triple: x86_64-apple-darwin, level: 2, os: macos-15-intel }
          - { triple: x86_64-apple-darwin, level: 3, os: macos-15-intel }
          - { triple: x86_64-apple-darwin, level: 4, os: macos-15-intel }
          - { triple: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    # 没写 container 的平台直接在 runner 上跑。
    container: ${{ matrix.container }}
    # fat LTO + 单 codegen unit 的发布构建，再加一遍同参数的测试构建，慢的 runner 上要一个多小时。
    timeout-minutes: 150
    env:
      TRIPLE: ${{ matrix.triple }}
      LEVEL: ${{ matrix.level }}
      VERSION: ${{ needs.verify.outputs.version }}
      # `sbot --version` 的 `commit:` 一行（src/cli/version.rs 用 option_env! 读）。
      SBOT_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - name: musl toolchain
        if: endsWith(matrix.triple, '-linux-musl')
        # musl-gcc：编译 C 依赖。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build flags
        run: |
          # $LEVEL 不加引号：aarch64 没有等级，空值不能当成一个空参数传进去。
          # shellcheck disable=SC2086
          .github/scripts/release-env.sh "$TRIPLE" $LEVEL | tee -a "$GITHUB_ENV"
          rustc -vV
      - name: Build
        # 显式 --target：RUSTFLAGS 只作用于目标平台的代码，不会用到构建脚本与过程宏上
        # （它们在 runner 上运行，runner 的 CPU 不一定支持这一级的指令）。
        run: cargo build --release --locked --target "$TRIPLE"
      - name: Locate the binary
        run: |
          bin=target/$TRIPLE/release/sbot
          case "$TRIPLE" in *-windows-*) bin=$bin.exe ;; esac
          ls -l "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Check linking
        run: .github/scripts/check-binary.sh "$BIN" "$SBOT_TARGET"
      - name: Can this runner execute it?
        id: host
        run: |
          runnable=true
          if [ -n "$LEVEL" ]; then
            host=$(.github/scripts/host-cpu-level.sh)
            echo "this runner's CPU supports up to x86-64-v$host; the artifact needs v$LEVEL"
            if [ "$host" -lt "$LEVEL" ]; then
              runnable=false
              echo "::warning::$SBOT_TARGET was built and link-checked but not executed: this runner's CPU only supports x86-64-v$host"
            fi
          fi
          echo "runnable=$runnable" >> "$GITHUB_OUTPUT"
      - name: Run it
        if: steps.host.outputs.runnable == 'true'
        run: .github/scripts/smoke-test.sh "$BIN" "$SBOT_TARGET" "$VERSION" "$GITHUB_SHA"
      - name: Tests built with the same flags
        if: steps.host.outputs.runnable == 'true'
        # 同样的 profile、同样的 CPU 等级参数（Rust 与 C 两边）：这一级的指令集下库的全部单元
        # 测试都要过（存储、加密、图片处理都在里面），而不只是程序能启动。只跑 `--lib`：
        # 集成测试查的是配置示例与源码规范，与编译参数无关，verify 任务已经跑过。
        run: cargo test --release --locked --target "$TRIPLE" --lib
      - name: Package
        env:
          RUNNABLE: ${{ steps.host.outputs.runnable }}
        run: |
          name=sbot-$VERSION-$SBOT_TARGET
          .github/scripts/package.sh "$BIN" "$name"
          # 没能运行的产物留一个标记，发布说明据此列出来。
          if [ "$RUNNABLE" != true ]; then
            : > "dist/$name.not-run"
          fi
          echo "ARTIFACT=sbot-$SBOT_TARGET" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/
          if-no-files-found: error
          # 已经是压缩包，不再压一遍。
          compression-level: 0
          retention-days: 7

  publish:
    # 只有 tag 推送才发布；试跑到构建为止。
    name: publish
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # 创建 release 并上传文件
      id-token: write # 构建来源证明：用 workflow 的 OIDC 身份向 Sigstore 签名
      attestations: write # 把证明存进仓库的 attestations
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbot-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          # 没能在 CI 上运行的产物（见 build 任务）：记下名字，标记文件不发布。
          : > ../not-run.txt
          for mark in *.not-run; do
            [ -e "$mark" ] || continue
            echo "${mark%.not-run}" >> ../not-run.txt
            rm "$mark"
          done
          count=$(find . -maxdepth 1 -type f \( -name 'sbot-*.tar.gz' -o -name 'sbot-*.zip' \) | wc -l)
          if [ "$count" -ne 20 ]; then
            echo "::error::expected 20 archives, found $count"
            ls -l
            exit 1
          fi
          sha256sum sbot-*.tar.gz sbot-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes
        run: |
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          if [ -s not-run.txt ]; then
            {
              echo
              echo "## 没有在 CI 上运行过的文件"
              echo
              echo "构建它们的机器 CPU 不支持对应的指令集，所以只做了链接检查，没有实际运行与测试："
              echo
              # 每行一个文件名，包成 Markdown 的列表项加行内代码；单引号里的反引号就是要的字面量。
              # shellcheck disable=SC2016
              sed 's/^/- `/; s/$/`/' not-run.txt
            } >> notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # `--latest`：版本号都带 `-alpha.N`，但目前没有别的版本，最新的 alpha 就是该下载的
        # 那个；不标成 prerelease，否则仓库首页的 “Latest” 会一直停在旧版本上。
        # `--verify-tag`：tag 必须已经在远端，不让 gh 自己建一个。
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/sbot-*.tar.gz dist/sbot-*.zip dist/SHA256SUMS
