# ScapegoatBot 配置文件

[napcat]
# NapCat WebSocket 服务器地址
ws_url = "ws://127.0.0.1:3001"
# 认证 Token（与 NapCat 端配置一致，可选）
# token = "your_token_here"

[whitelist]
# 可接收消息的群号列表
recv_groups = []
# 可接收消息的私聊 QQ 号列表
recv_privates = []
# 可发送消息的群号列表（必须是 recv_groups 的子集）
send_groups = []
# 可发送消息的私聊 QQ 号列表（必须是 recv_privates 的子集）
send_privates = []

[storage]
# 工作区根目录
workspace_dir = "./workspace"
# 单个文件的最大消息条数（超过自动拆分新文件）
max_messages_per_file = 500

[identity]
# 主人账号：填写 QQ 号或 "self"（使用当前登录账号）
# master = "self"
# 额外注入的身份文件（相对于 workspace_dir 的路径）
# extra_files = ["custom/NOTES.md"]

[llm]
# LLM 模型配置文件路径（相对于 config.toml 所在目录）
# 该文件定义所有可用的 LLM 模型（包括主代理和子代理使用的模型）
# 参见 llm.example.toml 了解完整配置格式
config_file = "llm.toml"
# 主代理使用的模型名称
# 必须对应 llm.toml 中某个 [[models]] 的 name 字段
# 子代理通过 SpawnAgent 的 model 参数引用 llm.toml 中的其他模型
primary_model = "main"

[compaction]
# 是否启用上下文压缩（当对话过长时自动将历史压缩为摘要）
enabled = true
# 触发压缩的近似总 token 数阈值
# 包括：系统提示 + 已有摘要 + 对话消息 + 工具定义
trigger_tokens = 180000
# 保留为最近后缀的近似 token 预算（这些最新消息保持原样不被压缩）
keep_recent_tokens = 8000
# 为摘要生成响应预留的最大 token 数
reserve_summary_tokens = 4096
# 拒绝压缩的最少消息数（过少的对话无需压缩）
min_messages_to_compact = 8

[skills]
# 要扫描的 skill 目录路径列表（支持 ~ 展开为用户主目录）
# 目录不存在时自动跳过
# dirs = ["~/my-skills", "/shared/skills"]

[control]
# 控制通道端口（CLI 通过此端口与守护进程通信）
port = 19800

# ============================================================================
# MCP 服务器配置（可选）
# ============================================================================
# 通过 MCP (Model Context Protocol) 接入外部工具服务器
# 每个服务器作为子进程启动，通过 stdin/stdout JSON-RPC 通信
# 工具命名格式：mcp.<服务器名>.<工具名>
#
# 示例：接入 Anthropic 官方文件系统 MCP 服务器
# [mcp.filesystem]
# command = "npx"
# args = ["-y", "@anthropic/mcp-filesystem", "/home/user/docs"]
# env = {}
# enabled = true        # 是否启用（默认 true）
# tool_timeout_secs = 30 # 工具调用超时（默认 30 秒）
#
# 示例：接入 GitHub MCP 服务器
# [mcp.github]
# command = "npx"
# args = ["-y", "@anthropic/mcp-github"]
# env = { "GITHUB_TOKEN" = "ghp_xxx" }

# ============================================================================
# Fetch 工具配置（可选）
# ============================================================================
# 启用后 Agent 可以获取网页内容（HTML 自动转换为 Markdown）
# 默认禁用，需要显式启用以允许 Agent 访问网络
# 内置 SSRF 防护：自动拦截对内网地址的访问

[fetch]
# 是否启用 Fetch 工具（默认 false）
enabled = false
# 域名过滤模式：
#   "whitelist" — 仅允许访问 domains 列表中的域名
#   "blacklist" — 禁止访问 domains 列表中的域名（默认）
# mode = "blacklist"
# 域名列表（配合 mode 使用）
# domains = ["evil.com", "malware.site"]
# HTTP 请求超时（秒）
# timeout_secs = 30
# 最大响应体大小（字节，默认 512 KB）
# max_response_bytes = 524288
# 最大输出字符数（默认 50000）
# max_output_chars = 50000
# 自定义 User-Agent（可选）
# user_agent = "Mozilla/5.0 (compatible; ScapegoatBot/0.2)"

# ============================================================================
# 蜂群子代理配置（可选）
# ============================================================================
# Agent 可以通过 SpawnAgent 工具生成子代理来并行处理任务
# 每个子代理运行在独立的 tokio 任务上，拥有独立的 LLM 会话
# 子代理可以调用所有工具，也可以嵌套生成子代理

# [swarm]
# 是否启用蜂群子代理功能（默认 true）
# enabled = true
# 最大嵌套深度（默认 32）— 子代理可以递归 spawn 子代理的最深层数
# max_depth = 32
# 最大并发子代理数（默认 1024）— 所有层级的子代理总数上限
# tokio 绿色线程极其轻量，1024 并发仅占用约 50MB 内存
# max_concurrency = 1024

