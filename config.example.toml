# ScapegoatBot 配置文件

[napcat]
# NapCat WebSocket 服务器地址
ws_url = "ws://127.0.0.1:3001"
# 认证 Token（与 NapCat 端配置一致，可选）
# token = "your_token_here"

[whitelist]
# 可接收消息的群号列表
recv_groups = []
# 可接收消息的私聊 QQ 号列表
recv_privates = []
# 可发送消息的群号列表（必须是 recv_groups 的子集）
send_groups = []
# 可发送消息的私聊 QQ 号列表（必须是 recv_privates 的子集）
send_privates = []

[storage]
# 工作区根目录
workspace_dir = "./workspace"
# 单个文件的最大消息条数（超过自动拆分新文件）
max_messages_per_file = 500

[identity]
# 主人账号：填写 QQ 号或 "self"（使用当前登录账号）
# master = "self"
# 额外注入的身份文件（相对于 workspace_dir 的路径）
# extra_files = ["custom/NOTES.md"]

[llm]
# LLM 提供商类型（默认 "openai"）
# "openai" — OpenAI 兼容 API（ChatCompletions / Responses 端点）
#            支持 OpenAI、DeepSeek、Moonshot、本地 Ollama 等任何兼容服务
# "anthropic" — Anthropic Messages API（Claude 系列模型）
provider = "openai"
# API 基础 URL
# OpenAI 兼容：如 https://api.openai.com/v1
# Anthropic：如 https://api.anthropic.com（留空时自动使用此默认值）
base_url = "https://api.openai.com/v1"
# API 密钥
# OpenAI 兼容：作为 Authorization: Bearer 头部发送
# Anthropic：常规 API key 通过 x-api-key 头部发送
#            OAuth setup token（sk-ant-oat01- 开头）通过 Authorization: Bearer 发送
api_key = ""
# 模型名称
model = "gpt-4o"
# 最大输出 token 数（可选）
# Anthropic API 强制要求此字段，默认 16384
# OpenAI 可选，不设置时由模型自行决定
# max_tokens = 16384
# 系统指令的角色名称（默认 "system"，某些提供商如 OpenAI o 系列要求 "developer"）
# system_role_name = "system"
# 推理深度/努力程度（可选，仅对支持该参数的模型有效）
# 常见值：none, minimal, low, medium, high, xhigh
# reasoning_effort = "medium"
# 每个任务的最大工具调用步数（安全上限，防止无限循环）
max_steps = 32
# HTTP 请求超时时间（秒），默认 300（5 分钟）
# 所有 API 请求使用流式传输以避免网关超时，此超时为最后安全网
# timeout_secs = 300
# API 协议类型（仅 OpenAI 提供商使用，默认 "chat_completions"）
# "chat_completions" — 经典 /v1/chat/completions 端点，兼容大多数渠道
# "responses" — 新一代 /v1/responses 端点（某些渠道仅支持此端点）
# Anthropic 提供商忽略此字段（始终使用 /v1/messages 端点）
# wire_api = "chat_completions"

[compaction]
# 是否启用上下文压缩（当对话过长时自动将历史压缩为摘要）
enabled = true
# 触发压缩的近似总 token 数阈值
# 包括：系统提示 + 已有摘要 + 对话消息 + 工具定义
trigger_tokens = 180000
# 保留为最近后缀的近似 token 预算（这些最新消息保持原样不被压缩）
keep_recent_tokens = 8000
# 为摘要生成响应预留的最大 token 数
reserve_summary_tokens = 4096
# 拒绝压缩的最少消息数（过少的对话无需压缩）
min_messages_to_compact = 8

[skills]
# 要扫描的 skill 目录路径列表（支持 ~ 展开为用户主目录）
# 目录不存在时自动跳过
# dirs = ["~/my-skills", "/shared/skills"]

[control]
# 控制通道端口（CLI 通过此端口与守护进程通信）
port = 19800

# ============================================================================
# MCP 服务器配置（可选）
# ============================================================================
# 通过 MCP (Model Context Protocol) 接入外部工具服务器
# 每个服务器作为子进程启动，通过 stdin/stdout JSON-RPC 通信
# 工具命名格式：mcp.<服务器名>.<工具名>
#
# 示例：接入 Anthropic 官方文件系统 MCP 服务器
# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@anthropic/mcp-filesystem", "/home/user/docs"]
# env = {}
# enabled = true        # 是否启用（默认 true）
# tool_timeout_secs = 30 # 工具调用超时（默认 30 秒）
#
# 示例：接入 GitHub MCP 服务器
# [mcp_servers.github]
# command = "npx"
# args = ["-y", "@anthropic/mcp-github"]
# env = { "GITHUB_TOKEN" = "ghp_xxx" }

# ============================================================================
# Fetch 工具配置（可选）
# ============================================================================
# 启用后 Agent 可以获取网页内容（HTML 自动转换为 Markdown）
# 默认禁用，需要显式启用以允许 Agent 访问网络
# 内置 SSRF 防护：自动拦截对内网地址的访问

[fetch]
# 是否启用 Fetch 工具（默认 false）
enabled = false
# 域名过滤模式：
#   "whitelist" — 仅允许访问 domains 列表中的域名
#   "blacklist" — 禁止访问 domains 列表中的域名（默认）
# mode = "blacklist"
# 域名列表（配合 mode 使用）
# domains = ["evil.com", "malware.site"]
# HTTP 请求超时（秒）
# timeout_secs = 30
# 最大响应体大小（字节，默认 512 KB）
# max_response_bytes = 524288
# 最大输出字符数（默认 50000）
# max_output_chars = 50000
# 自定义 User-Agent（可选）
# user_agent = "Mozilla/5.0 (compatible; ScapegoatBot/0.2)"
