[package]
name = "scapegoat-bot"
version = "0.2.0-alpha.35"
edition = "2024"
description = "ScapegoatBot - 一个 QQ Agent，代替用户像真人一样回复消息"
license = "MIT"
repository = "https://github.com/MoYeRanqianzhi/ScapegoatBot"
homepage = "https://github.com/MoYeRanqianzhi/ScapegoatBot"
authors = ["墨叶染千枝"]

[[bin]]
name = "sbot"
path = "src/main.rs"

[dependencies]
# 命令行参数解析（derive 模式）。CLI 是独立客户端，通过 IPC 与守护进程通信。
clap = { version = "4", features = ["derive"] }
# 异步运行时：守护进程、IPC、WebSocket、数据库都跑在 tokio 上。
tokio = { version = "1", features = ["full"] }
# NapCatLink SDK：QQ 机器人 WebSocket 客户端（项目自有代码，固定 alpha.2）。
# 上游运行时日志是中文，vendored 到 ./vendor/napcat-link 以翻译成英文；
# 版本 pin 不变，[patch.crates-io] 让本地副本参与构建。
napcat-link = "=0.1.0-alpha.2"
# HTTP 客户端：provider 与 Jev 判定器。
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# 流式读取 SSE 与并行工具执行。
futures-util = "0.3"
# 异步 trait：IPC Handler 需要 `Arc<dyn Handler>`。
async-trait = "0.1"
# 序列化 / 反序列化：IPC 帧、auth.json、models.json、审计记录。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML 解析：sbot.toml。写入用 toml_edit 以保留用户注释。
toml = "0.8"
toml_edit = "0.22"
# 错误处理。
anyhow = "1"
thiserror = "2"
# 日志与追踪。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 时间处理：消息分区、审计时间戳、定时器。
chrono = { version = "0.4", features = ["serde"] }
# 嵌入式 SQLite 数据库：VFS、索引、账本、审计。
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 内容加密：XChaCha20-Poly1305（设计 §6.6）。
chacha20poly1305 = "0.10"
# 从主密钥派生分域密钥。
hkdf = "0.12"
sha2 = "0.10"
# 密钥材料的密码学安全随机源。
getrandom = "0.3"
# 单实例文件锁。
fs2 = "0.4"
# 定位用户主目录（~/.sbot）。
dirs = "6"
# 过滤器正则（sbot.toml 的 [filter].ignore_patterns）。
regex = "1"
# Base64：加密后的 JSONL 行。
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.22"
# 十六进制编码：主密钥文件与哈希摘要。
hex = "0.4"
# VFS 路径的 Unicode NFC 规范化（设计 §6.3）。
unicode-normalization = "0.1"
# Unix 域套接字权限、Windows 管道 DACL 需要平台 API。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# 用本地 vendored 副本替换 registry 里的 napcat-link（只翻译了日志文本）。
[patch.crates-io]
napcat-link = { path = "vendor/napcat-link" }

[dev-dependencies]
# 临时目录：配置、存储、IPC 的单元测试。
tempfile = "3"
# 暂停时钟：队列去抖与定时器测试。
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.26"

# 发布构建：运行时性能优先，其次体积；构建时间不重要（CI 上跑）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
