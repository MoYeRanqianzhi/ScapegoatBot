[package]
name = "scapegoat-bot"
version = "0.2.0-alpha.45"
edition = "2024"
rust-version = "1.89"
description = "ScapegoatBot - 一个 QQ Agent，代替用户像真人一样回复消息"
license = "MIT"
repository = "https://github.com/MoYeRanqianzhi/ScapegoatBot"
authors = ["墨叶染千枝"]

[[bin]]
name = "sbot"
path = "src/main.rs"

[dependencies]
# 命令行参数解析（derive 模式）。CLI 是独立客户端，通过 IPC 与守护进程通信。
clap = { version = "4", features = ["derive"] }
# 异步运行时：守护进程、IPC、WebSocket、数据库都跑在 tokio 上。
tokio = { version = "1", features = ["full"] }
# NapCatLink SDK：QQ 机器人 WebSocket 客户端（项目自有代码，固定 alpha.2）。
# vendored 到 ./vendor/napcat-link：上游运行时日志是中文，翻译成英文；TLS 后端从
# native-tls 换成 rustls（见下面 tokio-tungstenite 的说明）。版本 pin 不变，
# [patch.crates-io] 让本地副本参与构建。
napcat-link = "=0.1.0-alpha.2"
# HTTP 客户端：provider 与 Jev 判定器。
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# 流式读取 SSE 与并行工具执行。
futures-util = "0.3"
# monitor 的 stream 源（外部 WebSocket）；与 napcat-link 用同一版本与 TLS 后端。
# TLS 用 rustls + 内置的 Mozilla 根证书（webpki-roots），与 reqwest 一致：二进制不依赖系统的
# OpenSSL（native-tls 在 Linux 上动态链接 libssl.so.3，发行版之间不通用），也不读系统证书库。
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# 异步 trait：IPC Handler 需要 `Arc<dyn Handler>`。
async-trait = "0.1"
# 序列化 / 反序列化：IPC 帧、auth.json、models.json、审计记录。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML 解析：sbot.toml。写入用 toml_edit 以保留用户注释。
toml = "0.8"
toml_edit = "0.22"
# 错误处理。
anyhow = "1"
thiserror = "2"
# 日志与追踪。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 时间处理：消息分区、审计时间戳、定时器。
chrono = { version = "0.4", features = ["serde"] }
# 嵌入式 SQLite 数据库：VFS、索引、账本、审计。`bundled` 把 SQLite 的 C 源码编进二进制，不用
# 系统的库。`fallible_uint`：允许读写 `u64` / `usize`（大小、偏移、计数），超出 SQLite 整数
# 范围（i64）时返回错误而不是截断。
rusqlite = { version = "0.43", features = ["bundled", "backup", "fallible_uint"] }
# 内容加密：XChaCha20-Poly1305（设计 §6.6）。
chacha20poly1305 = "0.11"
# 从主密钥派生分域密钥。
hkdf = "0.12"
sha2 = "0.10"
# 密钥材料的密码学安全随机源。
getrandom = "0.4"
# 单实例文件锁。
fs2 = "0.4"
# 定位用户主目录（~/.sbot）。
dirs = "6"
# 过滤器正则（sbot.toml 的 [filter].ignore_patterns）。
regex = "1"
# 图片：解码 / 缩放 / 重新编码（入站图片、local.media.image.*）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# 在图片上画文字与旋转（local.media.image.*）。只开 `text`：默认特性会打开 image 的全部默认
# 格式（AVIF 编码器 rav1e、EXR、TIFF、DDS……，体积大，也多了一批解析不可信输入的解码器）、
# rayon 线程池与 FFT，这里都用不上；解码格式只有上面 image 列出的那几种。
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
# 系统字体枚举与字形渲染（local.media.image.text / .fonts）。不内置字体：没有系统字体时
# `.fonts` 为空、`.text` 报错。
fontdb = "0.24.0"
ab_glyph = "0.2.32"
# Base64：加密后的 JSONL 行、发给 NapCat 的 base64:// 文件。
base64 = "0.22"
# 十六进制编码：主密钥文件与哈希摘要。
hex = "0.4"
# VFS 路径的 Unicode NFC 规范化（设计 §6.3）。
unicode-normalization = "0.1"
# 全局内存分配器（见 src/main.rs）。musl 自带的 malloc 在多线程下很慢；各平台统一用它，
# 性能与内存行为一致。
mimalloc = "0.1.52"
# Unix 域套接字权限、Windows 管道 DACL 需要平台 API。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# 用本地 vendored 副本替换 registry 里的 napcat-link（日志文本翻译、TLS 换 rustls）。
[patch.crates-io]
napcat-link = { path = "vendor/napcat-link" }

[dev-dependencies]
# 临时目录：配置、存储、IPC 的单元测试。
tempfile = "3"
# 暂停时钟：队列去抖与定时器测试。
tokio = { version = "1", features = ["test-util"] }

# 发布构建：运行时性能优先，其次体积；构建时间不重要（CI 上跑）。
#
# `panic = "abort"`：任何 panic 立刻结束整个守护进程，不展开栈。
# - 体积：不带展开表与清理代码。x86_64_v3 的 Windows 版实测 11.97 MiB，改成 unwind 是
#   16.93 MiB（多 41.5%）。
# - 行为：unwind 下一个后台任务 panic 只死它自己，进程还在，但那条管线（收消息、定时器、
#   IPC……）从此没人干活，从外面看不出来；直接退出则由服务管理器重新拉起，中断的回合在
#   启动时恢复（`session::turn_buffer`）。无人值守时后者才是能自己恢复的那一种，所以部署
#   要配自动重启。
# - 代码里的后果：测试与调试构建仍是 unwind，`JoinHandle` 的 `Err` 分支在那里能收到
#   panic；发布构建里这些分支只剩“任务被取消 / 运行时在关闭”一种来源。不要靠它们做隔离。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
