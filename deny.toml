# cargo-deny 配置：依赖的安全公告、许可证、禁用包与来源检查。
#
# CI 的 `deny` 任务跑 `cargo deny check`（见 .github/workflows/ci.yml）。本地：
#   cargo install cargo-deny --locked && cargo deny check
# 文档：https://embarkstudios.github.io/cargo-deny/

[graph]
# 只看发布的平台（见 .github/workflows/release.yml）。只在别的平台出现的依赖（wasm、
# Android、UEFI 等）不进二进制，不必为它们的许可证或公告卡住 CI。
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RustSec 公告库里命中的漏洞、不再维护、已撤回（yanked）的版本都报错。要忽略某一条，
# 写清楚原因：{ id = "RUSTSEC-xxxx-xxxx", reason = "..." }。
ignore = [
    # ttf-parser 不再维护（不是漏洞公告）。它经 ab_glyph（owned_ttf_parser）进来，ab_glyph 与
    # imageproc 的文字渲染目前只有这一个字体解析后端，没有可升级的版本。它解析的是本机安装
    # 的系统字体（`local.media.image.text` / `.fonts`），不是聊天里来的数据。ab_glyph 换了
    # 解析后端，或者 ttf-parser 出了真正的漏洞公告（那是另一个 ID，仍然会报错）时删掉这一条。
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no replacement in ab_glyph yet; it only parses fonts installed on the host" },
]

[licenses]
# 允许的许可证：都是宽松许可证。MPL-2.0 是文件级的弱 copyleft，只要求修改过的那个文件
# 开源，原样使用（option-ext，经 dirs）没有额外义务。CDLA-Permissive-2.0 是 webpki-roots
# 里 Mozilla 根证书数据的许可证。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
# 同一个包的多个版本只警告：它们来自上游的依赖，强求一致要等上游。
multiple-versions = "warn"
# `*` 版本号不可复现，禁止。
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# 二进制不能再依赖系统 OpenSSL：Linux 上它动态链接 libssl.so.3，不同发行版之间不通用
# （TLS 统一走 rustls，见 Cargo.toml）。
deny = [
    { crate = "openssl-sys", reason = "links the system OpenSSL; TLS goes through rustls" },
    { crate = "native-tls", reason = "uses the system OpenSSL on Linux; TLS goes through rustls" },
]
skip = []
skip-tree = []

[sources]
# 依赖只能来自 crates.io；git 依赖与其他 registry 都拒绝（napcat-link 是 [patch] 到本地
# vendor 目录的路径依赖，不受这里限制）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
