# ScapegoatBot 0.2 配置示例
#
# 严格 schema：未知字段会让启动失败；`version` 必须为 1。
# 完整说明见 `sbot docs sbot-deploy configuration`。
# 这里写出的每个值都等于程序的默认值（末尾的示例 monitor 除外）：整份照抄不会改变任何
# 行为。要改哪一项，就在自己的 sbot.toml 里只写那一项。

version = 1

# 模型清单与凭据；相对路径按本文件所在目录解析。
models_file = "~/.sbot/models.json"
auth_file = "~/.sbot/auth.json"

[ipc]
# Windows 命名管道名 / Unix socket 文件名；CLI 与进程必须一致。
name = "scapegoat-bot"

[agent]
# stand_in：使用主人自己的 QQ；companion：使用另一个账号。
mode = "stand_in"
# stand_in 留 0 表示用登录账号；companion 必须填且不能等于登录账号。
owner_qq = 0
owner_name = ""
# 主模型与白名单，形式为 provider/id。
model = "anthropic/claude-opus-5-5"
available_models = [
    "anthropic/claude-opus-5-5",
    "anthropic/claude-haiku-5-5",
    "deepseek/deepseek-chat",
]
fallback_models = []
# 与 models.json 的 thinking_levels 校验。
thinking_level = "high"
max_output_tokens = 8192
max_steps = 64
# owner 通知目标：self 或 QQ 号。
master = "self"
# 允许读/发的 chat：group:<gid> / private:<qq> / *；空 = 禁止。
receive_scopes = ["*"]
send_scopes = ["*"]
retry_attempts = 3
retry_base_ms = 400
retry_max_ms = 30000
# stepped：400/800/1600…（默认）；fixed：每次固定 retry_base_ms。
retry_mode = "stepped"
# 压缩摘要用的模型（provider/id）；空 = 主模型。
compaction_model = ""

[napcat]
# OneBot 11 WebSocket 地址；access token 放 auth.json。
url = "ws://127.0.0.1:3001"

[filter]
# 准入是“拒收”：命中的消息不写 JSONL、不进 inbox、不进 transcript。
ignore_groups = []
ignore_users = []
ignore_patterns = []
# 群里只接收 @ 了本账号（或 @全体成员）的消息；只回复本账号、没有 @ 的不算。
require_mention = false

[queue]
# steer：回合中到达的消息注入当前回合；followup：回合结束后逐条各开一个回合；
# collect：回合结束后再等 debounce_ms，把期间的消息合并成一个回合。
mode = "steer"
max_concurrent = 4
cap_messages = 200
# summarize / old / new
drop = "summarize"
debounce_ms = 3000

[storage]
# 相对配置文件目录；默认即 ~/.sbot/data。
path = "./data"
encryption = "xchacha20poly1305"
max_blob_bytes = 536870912
max_vfs_bytes = 10737418240
max_message_bytes = 10737418240
max_session_bytes = 2147483648
# 0 = 只按配额清理。
message_retention_days = 0
session_retention_days = 0

[tools]
max_result_bytes = 32768
max_schema_tokens = 12000

[tools.web_search]
# auto / server / tool；Chat 协议只能用 tool。
backend = "auto"
# tool 后端必须配置；key 放 auth.json 的 tools.web_search.api_key。
base_url = ""
count = 10

[tools.web_fetch]
backend = "auto"
base_url = ""
max_content_tokens = 20000
# true = 本地抓取（逐跳校验、HTML 转文本），不经过 base_url。
local = false

[tools.download]
max_bytes = 536870912
allowed_domains = []
blocked_domains = []

[mcp]
# 可选；默认关闭。每个服务器是一个 [[mcp.servers]] 段。
enabled = false

# [[mcp.servers]]
# name = "echo"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-everything"]
# env = { FOO = "bar" }
# enabled = true

[memory]
# 记忆是 VFS 里的普通文件（/USER.md、/MEMORY.md、/memory/*.md），agent 用文件工具读写。
# enabled：后台复盘是否把候选追加进记忆。
enabled = true
# 后台复盘追加时的上限：单条候选的字符数、索引的行数。
max_entry_chars = 4000
max_index_lines = 200
# 注入上下文时的截断上限：/MEMORY.md 的字节数（也是复盘追加的上限）、/USER.md 的字符数。
max_index_bytes = 25000
user_max_chars = 4000
# off / idle / every_turn
review = "idle"
idle_minutes = 10
review_interval_minutes = 60
# 复盘与压缩前记忆提取用的模型（provider/id）；空 = 跟随主模型。
review_model = ""

[skills]
# 技能存放在 VFS 的 /skills，随数据库一起备份。
curator = true
curator_interval_hours = 168
curator_min_new_skills = 3

[style]
enabled = true
profile_path = "/STYLE.md"
max_chars = 2000

[swarm]
enabled = true
max_depth = 8
max_concurrency = 16
agents_dir = "~/.sbot/agents"
default_max_steps = 32

# 长期常驻的 monitor；运行时也能用 Monitor 工具增删（重启即消失）。
# deliver.as：event（默认）/ prompt（投递 deliver.prompt）/ chat（qq 源，交给会话队列）。
[[monitor]]
name = "at-me"
enabled = false
source = { qq = true }
when = "event.type == 'message' and event.mentions_self"
deliver = { to = "main", as = "event", batch_window_ms = 200 }
lifecycle = { idle_only = false, max_events = 1000, expires = "0", catch_up = "coalesce" }

[security]
# 周期安全检查：每新增这么多 token，在回合边界跑一次独立模型检查。
check_every_tokens = 262144
check_on_compaction = true
check_overlap_tokens = 4096
review_model = ""
check_timeout_secs = 60

[security.guard]
enabled = true
# shadow 只记录；enforce 命中即 hold。启用 enforce 前先配好分类器。
mode = "shadow"
# jev / llm / off；llm 复用主 provider。
backend = "jev"
model = ""
# Jev 端点；backend = "jev" 且 enforce 时必须非空（auth.json 里还要有 key），否则每个回合都会被 hold。
base_url = ""
threshold = 0.9
timeout_ms = 800
max_state_tokens = 8000

[budget]
daily_tokens = 2000000
daily_usd = 10.0
turn_tokens = 150000
chat_sends_per_hour = 60
chat_turns_per_hour = 120
round_trip_wall_secs = 600
guard_usd_per_day = 0.20

[gate]
# trusted / auto / approve；approve 用 `sbot gate approve <id>` 确认。
mode = "auto"
max_per_minute = 20
llm_review = false

[compaction]
reserve_tokens = 16384
turn_context_budget = 120000
keep_recent_tokens = 20000
max_failures = 3
# 压缩前提取记忆、压缩后注入记忆索引、裁剪旧工具结果。
memory_flush = true
post_compact_recall = true
prune = true
prune_soft_limit = 4000
prune_keep_turns = 3

# 上下文注入不在配置里：/AGENTS.md、/USER.md、/MEMORY.md、风格档案与技能索引
# 存在即注入；其余文件（例如人设 /SOUL.md）由 agent 自己列在 VFS 的 /hooks/context.toml。

# 事件 hook：事件与动作的可用组合见 `sbot docs sbot-deploy configuration`。
# [[hooks.events]]
# event = "before_send"
# action = "rewrite"
# pattern = "secret"
# replacement = "[redacted]"
# enabled = true
